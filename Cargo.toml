[package]
name = "sondpi"
version = "0.1.0"
edition = "2021"
description = "Tek tıkla DPI atlatma: TLS/HTTP desync, yanıtsız bağlantıyı yeniden deneme, temiz DNS"
license = "MIT"
publish = false

[lib]
name = "sondpi"
path = "src/lib.rs"

[[bin]]
name = "sondpi"
path = "src/main.rs"

# Tek bağımlılık: Microsoft'un Windows API bildirimleri. Yeni crate ekleme; yalnızca
# aşağıdaki özellik listesine satır eklenebilir.
[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinHttp",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
